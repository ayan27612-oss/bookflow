<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#08090b">
<title>BOOKFLOW Admin</title>

<style>
:root{
  --bg:#08090b;
  --panel:#111317;
  --panel2:#17191d;
  --line:rgba(255,255,255,.10);
  --text:#f5f1e8;
  --muted:#8f9299;
  --gold:#dfbf7a;
  --gold2:#f0d28f;
  --danger:#ff7777;
  --green:#83d6a1;
}

*{
  box-sizing:border-box;
}

body{
  margin:0;
  background:radial-gradient(circle at 80% 0%,rgba(223,191,122,.10),transparent 32%),var(--bg);
  color:var(--text);
  font-family:Arial,sans-serif;
  min-height:100vh;
}

button,
input{
  font:inherit;
}

.hidden{
  display:none!important;
}

.wrap{
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

header{
  height:76px;
  border-bottom:1px solid var(--line);
  display:flex;
  align-items:center;
}

.logo{
  font-family:Georgia,serif;
  font-size:25px;
  letter-spacing:1px;
}

.logo span{
  color:var(--gold);
}

.header-inner{
  display:flex;
  justify-content:space-between;
  align-items:center;
  width:min(1180px,calc(100% - 32px));
  margin:auto;
}

.btn{
  border:0;
  border-radius:12px;
  padding:12px 18px;
  cursor:pointer;
  font-weight:700;
}

.gold{
  background:var(--gold);
  color:#111;
}

.ghost{
  background:transparent;
  color:var(--text);
  border:1px solid var(--line);
}

main{
  padding:45px 0;
}

.login{
  width:min(430px,100%);
  margin:7vh auto;
  background:rgba(17,19,23,.92);
  border:1px solid var(--line);
  border-radius:24px;
  padding:32px;
  box-shadow:0 25px 80px rgba(0,0,0,.45);
}

.kicker{
  color:var(--gold);
  font-size:11px;
  letter-spacing:3px;
  text-transform:uppercase;
  font-weight:800;
}

h1{
  font-family:Georgia,serif;
  font-size:42px;
  line-height:1.05;
  margin:12px 0;
}

p{
  color:var(--muted);
  line-height:1.6;
}

label{
  display:block;
  font-size:12px;
  color:var(--muted);
  margin:20px 0 8px;
}

input{
  width:100%;
  padding:14px;
  border-radius:12px;
  border:1px solid var(--line);
  background:#0c0e11;
  color:var(--text);
  outline:none;
}

input:focus{
  border-color:rgba(223,191,122,.65);
}

.login .btn{
  width:100%;
  margin-top:22px;
}

.error{
  color:var(--danger);
  font-size:13px;
  margin-top:15px;
  min-height:18px;
}

.top{
  display:flex;
  justify-content:space-between;
  align-items:end;
  gap:20px;
  margin-bottom:28px;
}

.top h1{
  margin:5px 0 0;
}

.stats{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
  margin-bottom:22px;
}

.stat{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:18px;
  padding:20px;
}

.stat small{
  color:var(--muted);
  display:block;
}

.stat strong{
  font-size:28px;
  display:block;
  margin-top:8px;
}

.card{
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:20px;
  overflow:hidden;
}

.card-head{
  padding:20px;
  border-bottom:1px solid var(--line);
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.table-wrap{
  overflow:auto;
}

table{
  width:100%;
  border-collapse:collapse;
  min-width:760px;
}

th,
td{
  text-align:left;
  padding:16px 18px;
  border-bottom:1px solid var(--line);
  font-size:13px;
}

th{
  color:var(--muted);
  font-size:11px;
  letter-spacing:1px;
  text-transform:uppercase;
}

.status{
  display:inline-block;
  padding:6px 10px;
  border-radius:999px;
  background:rgba(223,191,122,.12);
  color:var(--gold2);
  font-size:11px;
}

.empty{
  padding:45px;
  text-align:center;
  color:var(--muted);
}

@media(max-width:700px){

  .wrap{
    width:min(100% - 24px,1180px);
  }

  main{
    padding:28px 0;
  }

  .stats{
    grid-template-columns:repeat(2,1fr);
  }

  .top{
    align-items:flex-start;
    flex-direction:column;
  }

  .login{
    padding:25px;
  }

  h1{
    font-size:36px;
  }
}
</style>
</head>

<body>

<header>
  <div class="header-inner">

    <div class="logo">
      BOOK<span>FLOW</span>
    </div>

    <button
      id="logoutBtn"
      class="btn ghost hidden">
      Sign out
    </button>

  </div>
</header>

<main class="wrap">

  <section id="loginView" class="login">

    <div class="kicker">
      Business portal
    </div>

    <h1>
      Welcome back.
    </h1>

    <p>
      Sign in to manage your appointments.
    </p>

    <label for="email">
      Email
    </label>

    <input
      id="email"
      type="email"
      autocomplete="username"
      placeholder="admin@example.com"
    >

    <label for="password">
      Password
    </label>

    <input
      id="password"
      type="password"
      autocomplete="current-password"
      placeholder="••••••••"
    >

    <button
      id="loginBtn"
      class="btn gold">
      Sign in
    </button>

    <div
      id="loginError"
      class="error">
    </div>

  </section>


  <section
    id="dashboardView"
    class="hidden">

    <div class="top">

      <div>

        <div class="kicker">
          Lumière Studio
        </div>

        <h1>
          Appointments
        </h1>

        <p id="welcomeText">
          Manage today's bookings.
        </p>

      </div>

      <button
        id="refreshBtn"
        class="btn ghost">
        Refresh
      </button>

    </div>


    <div class="stats">

      <div class="stat">
        <small>Today</small>
        <strong id="todayCount">0</strong>
      </div>

      <div class="stat">
        <small>Pending</small>
        <strong id="pendingCount">0</strong>
      </div>

      <div class="stat">
        <small>Confirmed</small>
        <strong id="confirmedCount">0</strong>
      </div>

      <div class="stat">
        <small>Completed</small>
        <strong id="completedCount">0</strong>
      </div>

    </div>


    <div class="card">

      <div class="card-head">

        <strong>
          Recent appointments
        </strong>

        <span
          id="loadStatus"
          style="color:var(--muted);font-size:12px">
        </span>

      </div>

      <div class="table-wrap">

        <table>

          <thead>

            <tr>
              <th>Customer</th>
              <th>Service</th>
              <th>Date</th>
              <th>Time</th>
              <th>Status</th>
            </tr>

          </thead>

          <tbody id="bookingRows">
          </tbody>

        </table>

      </div>

      <div
        id="emptyState"
        class="empty hidden">
        No appointments found.
      </div>

    </div>

  </section>

</main>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
  "https://vcrufsufmpclfkpvrkab.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_c5UwRLAz9QNSasN6frvUGQ_6nKkMBHw";

const supabaseClient =
  window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY
  );


const loginView =
  document.getElementById("loginView");

const dashboardView =
  document.getElementById("dashboardView");

const logoutBtn =
  document.getElementById("logoutBtn");

const loginError =
  document.getElementById("loginError");

const bookingRows =
  document.getElementById("bookingRows");

const emptyState =
  document.getElementById("emptyState");

const loadStatus =
  document.getElementById("loadStatus");


function showDashboard(){

  loginView.classList.add("hidden");

  dashboardView.classList.remove("hidden");

  logoutBtn.classList.remove("hidden");

}


function showLogin(){

  dashboardView.classList.add("hidden");

  loginView.classList.remove("hidden");

  logoutBtn.classList.add("hidden");

}


function formatDate(value){

  if(!value){
    return "—";
  }

  return new Date(
    value + "T00:00:00"
  ).toLocaleDateString(
    "en-IN",
    {
      day:"2-digit",
      month:"short",
      year:"numeric"
    }
  );

}


function formatTime(value){

  if(!value){
    return "—";
  }

  const [h,m] =
    value.split(":").map(Number);

  const d = new Date();

  d.setHours(
    h,
    m || 0,
    0,
    0
  );

  return d.toLocaleTimeString(
    "en-IN",
    {
      hour:"2-digit",
      minute:"2-digit"
    }
  );

}


function escapeHTML(value){

  return String(
    value ?? ""
  ).replace(
    /[&<>"']/g,
    m => ({
      "&":"&amp;",
      "<":"&lt;",
      ">":"&gt;",
      "\"":"&quot;",
      "'":"&#039;"
    }[m])
  );

}


async function loadDashboard(){

  loadStatus.textContent =
    "Loading…";


  const businessResult =
    await supabaseClient
      .from("businesses")
      .select("id")
      .eq("slug","lumiere-studio")
      .single();


  if(businessResult.error){

    loadStatus.textContent =
      "Could not load";

    console.error(
      businessResult.error
    );

    alert(
      businessResult.error.message
    );

    return;
  }


  const businessId =
    businessResult.data.id;


  const {data,error} =
    await supabaseClient
      .from("bookings")
      .select(
        "id,customer_name,customer_phone,service_name,booking_date,booking_time,status,duration_minutes,service_price"
      )
      .eq(
        "business_id",
        businessId
      )
      .order(
        "booking_date",
        {
          ascending:false
        }
      )
      .order(
        "booking_time",
        {
          ascending:true
        }
      )
      .limit(100);


  if(error){

    loadStatus.textContent =
      "Could not load";

    console.error(error);

    alert(error.message);

    return;
  }


  const today =
    new Date()
      .toISOString()
      .slice(0,10);


  const todayRows =
    data.filter(
      x => x.booking_date === today
    );


  document.getElementById(
    "todayCount"
  ).textContent =
    todayRows.length;


  document.getElementById(
    "pendingCount"
  ).textContent =
    data.filter(
      x => x.status === "pending"
    ).length;


  document.getElementById(
    "confirmedCount"
  ).textContent =
    data.filter(
      x => x.status === "confirmed"
    ).length;


  document.getElementById(
    "completedCount"
  ).textContent =
    data.filter(
      x => x.status === "completed"
    ).length;


  bookingRows.innerHTML =
    data.map(
      row => `

        <tr>

          <td>
            <strong>
              ${escapeHTML(row.customer_name)}
            </strong>

            <br>

            <small style="color:var(--muted)">
              ${escapeHTML(row.customer_phone)}
            </small>

          </td>

          <td>
            ${escapeHTML(row.service_name)}
          </td>

          <td>
            ${formatDate(row.booking_date)}
          </td>

          <td>
            ${formatTime(row.booking_time)}
          </td>

          <td>
            <span class="status">
              ${escapeHTML(row.status)}
            </span>
          </td>

        </tr>

      `
    )
    .join("");


  emptyState.classList.toggle(
    "hidden",
    data.length !== 0
  );


  loadStatus.textContent =
    `${data.length} booking${data.length === 1 ? "" : "s"}`;

}


async function login(){

  loginError.textContent = "";

  const email =
    document
      .getElementById("email")
      .value
      .trim();

  const password =
    document
      .getElementById("password")
      .value;


  if(!email || !password){

    loginError.textContent =
      "Enter your email and password.";

    return;
  }


  const {error} =
    await supabaseClient.auth.signInWithPassword({
      email,
      password
    });


  if(error){

    loginError.textContent =
      error.message;

    return;
  }


  showDashboard();

  await loadDashboard();

}


document
  .getElementById("loginBtn")
  .onclick = login;


document
  .getElementById("password")
  .addEventListener(
    "keydown",
    e => {

      if(e.key === "Enter"){
        login();
      }

    }
  );


document
  .getElementById("refreshBtn")
  .onclick =
  loadDashboard;


logoutBtn.onclick =
  async () => {

    await supabaseClient
      .auth
      .signOut();

    showLogin();

  };


(async()=>{

  const {data} =
    await supabaseClient
      .auth
      .getSession();


  if(data.session){

    showDashboard();

    await loadDashboard();

  }

})();

</script>

</body>
</html>
