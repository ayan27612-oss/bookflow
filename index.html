<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   BOOKFLOW + SUPABASE
========================================================= */

const SUPABASE_URL = "https://vcrufsufmpclfkpvrkab.supabase.co";

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_c5UwRLAz9QNSas6NfrvUGQ_6nKkMBHw";

const { createClient } = supabase;

const db = createClient(
  SUPABASE_URL,
  SUPABASE_PUBLISHABLE_KEY
);


/* =========================================================
   GLOBAL STATE
========================================================= */

const booking = {
  businessId: null,
  serviceId: null,
  service: "Hair Styling",
  price: "₹799",
  priceNumber: 799,
  duration: 60,
  date: "",
  dateISO: "",
  time: "10:00 AM",
  timeISO: "10:00:00"
};

let business = null;
let services = [];
let bookingSubmitting = false;


/* =========================================================
   DOM
========================================================= */

const modal = document.getElementById("bookingModal");
const navbar = document.getElementById("navbar");
const menuBtn = document.getElementById("menuBtn");


/* =========================================================
   LOADER
========================================================= */

window.addEventListener("load", async () => {

  setTimeout(() => {
    document.getElementById("loader").classList.add("hide");
  }, 900);

  await initializeBookflow();

});


/* =========================================================
   INITIALIZE BOOKFLOW
========================================================= */

async function initializeBookflow(){

  try{

    await loadBusiness();

    await loadServices();

    generateBookingDates();

    updateBookingServiceUI();

    console.log("BOOKFLOW initialized successfully.");

  }catch(error){

    console.error("BOOKFLOW initialization error:", error);

    showToast(
      "Booking system is temporarily unavailable."
    );

  }

}


/* =========================================================
   LOAD BUSINESS
========================================================= */

async function loadBusiness(){

  const { data, error } = await db
    .from("businesses")
    .select("*")
    .eq("slug", "lumiere-studio")
    .eq("active", true)
    .maybeSingle();

  if(error){

    console.error("Business loading error:", error);

    throw error;

  }

  if(!data){

    throw new Error(
      "Business 'lumiere-studio' was not found."
    );

  }

  business = data;

  booking.businessId = data.id;

  console.log("Business loaded:", business.name);

}


/* =========================================================
   LOAD SERVICES
========================================================= */

async function loadServices(){

  if(!booking.businessId){

    throw new Error("Business ID missing.");

  }

  const { data, error } = await db
    .from("services")
    .select("*")
    .eq("business_id", booking.businessId)
    .eq("active", true)
    .order("sort_order", { ascending:true });

  if(error){

    console.error("Services loading error:", error);

    throw error;

  }

  services = data || [];

  if(!services.length){

    throw new Error("No active services found.");

  }

  console.log("Services loaded:", services);

  renderServicesFromDatabase();

}


/* =========================================================
   RENDER SERVICES FROM DATABASE
========================================================= */

function renderServicesFromDatabase(){

  const cards = document.querySelectorAll(".service-card");

  services.forEach((service,index)=>{

    const card = cards[index];

    if(!card) return;

    const nameElement =
      card.querySelector(".service-name");

    const priceElement =
      card.querySelector(".price");

    const descriptionElement =
      card.querySelector(".service-content p");

    const button =
      card.querySelector(".book-service");

    if(nameElement){
      nameElement.textContent = service.name;
    }

    if(priceElement){
      priceElement.textContent =
        formatPrice(service.price);
    }

    if(descriptionElement && service.description){
      descriptionElement.textContent =
        service.description;
    }

    if(button){

      button.onclick = () => {

        selectServiceFromDatabase(service);

      };

    }

  });


  /* Update service buttons inside modal */

  const modalButtons =
    document.querySelectorAll(
      "#step1 .book-service"
    );

  services.forEach((service,index)=>{

    const button = modalButtons[index];

    if(!button) return;

    button.innerHTML = `
      ${escapeHTML(service.name)}
      <span style="float:right;color:var(--gold2);">
        ${formatPrice(service.price)}
      </span>
    `;

    button.onclick = () => {

      chooseServiceFromDatabase(service);

    };

  });

}


/* =========================================================
   SERVICE SELECTION
========================================================= */

function selectServiceFromDatabase(service){

  booking.serviceId = service.id;
  booking.service = service.name;
  booking.priceNumber = Number(service.price);
  booking.price = formatPrice(service.price);
  booking.duration = Number(service.duration_minutes);

  openBooking();

  chooseServiceFromDatabase(service);

}


function chooseServiceFromDatabase(service){

  booking.serviceId = service.id;
  booking.service = service.name;
  booking.priceNumber = Number(service.price);
  booking.price = formatPrice(service.price);
  booking.duration = Number(service.duration_minutes);

  updateBookingServiceUI();

  goStep(2);

}


function updateBookingServiceUI(){

  document.getElementById(
    "selectedServiceName"
  ).textContent = booking.service;

  document.getElementById(
    "selectedServicePrice"
  ).textContent = booking.price;

  document.getElementById(
    "step2Service"
  ).textContent = booking.service;

  document.getElementById(
    "step2Price"
  ).textContent = booking.price;

  document.getElementById(
    "step3Service"
  ).textContent = booking.service;

  document.getElementById(
    "step3Price"
  ).textContent = booking.price;

}


/* =========================================================
   LEGACY SERVICE FUNCTIONS
========================================================= */

function selectService(name,price){

  const service = services.find(
    item => item.name === name
  );

  if(service){

    selectServiceFromDatabase(service);

    return;

  }

  booking.service = name;
  booking.price = price;
  booking.priceNumber = parsePrice(price);

  openBooking();

  goStep(2);

  updateBookingServiceUI();

}


function chooseService(name,price){

  const service = services.find(
    item => item.name === name
  );

  if(service){

    chooseServiceFromDatabase(service);

    return;

  }

  booking.service = name;
  booking.price = price;
  booking.priceNumber = parsePrice(price);

  updateBookingServiceUI();

  goStep(2);

}


/* =========================================================
   DATE GENERATION
========================================================= */

function generateBookingDates(){

  const grid = document.querySelector(".date-grid");

  if(!grid) return;

  grid.innerHTML = "";

  const today = new Date();

  for(let i=0;i<8;i++){

    const date = new Date(today);

    date.setDate(
      today.getDate() + i
    );

    const dayName =
      date.toLocaleDateString("en-US",{
        weekday:"short"
      }).toUpperCase();

    const dayNumber =
      String(date.getDate()).padStart(2,"0");

    const displayDate =
      date.toLocaleDateString("en-US",{
        weekday:"short",
        month:"short",
        day:"numeric"
      });

    const isoDate =
      formatISODate(date);

    const button =
      document.createElement("button");

    button.className =
      "date-btn" + (i === 0 ? " selected" : "");

    button.innerHTML = `
      <small>${dayName}</small>
      <strong>${dayNumber}</strong>
    `;

    button.onclick = () => {

      selectDate(
        button,
        displayDate,
        isoDate
      );

    };

    grid.appendChild(button);

    if(i === 0){

      booking.date = displayDate;
      booking.dateISO = isoDate;

    }

  }

}


/* =========================================================
   DATE SELECTION
========================================================= */

function selectDate(button,date,dateISO){

  document.querySelectorAll(
    ".date-btn"
  ).forEach(btn => {

    btn.classList.remove("selected");

  });

  button.classList.add("selected");

  booking.date = date;

  booking.dateISO =
    dateISO || convertDisplayDateToISO(date);

}


/* =========================================================
   TIME SELECTION
========================================================= */

function selectTime(button,time){

  document.querySelectorAll(
    ".time-btn"
  ).forEach(btn => {

    btn.classList.remove("selected");

  });

  button.classList.add("selected");

  booking.time = time;

  booking.timeISO =
    convertTimeToPostgres(time);

}


/* =========================================================
   BOOKING MODAL
========================================================= */

function openBooking(){

  modal.classList.add("active");

  document.body.classList.add("modal-open");

  resetBooking();

}


function closeBooking(){

  modal.classList.remove("active");

  document.body.classList.remove("modal-open");

}


modal.addEventListener("click",e=>{

  if(e.target === modal){

    closeBooking();

  }

});


/* =========================================================
   BOOKING STEPS
========================================================= */

function goStep(number){

  document.querySelectorAll(
    ".booking-step"
  ).forEach(step=>{

    step.classList.remove("active");

  });

  const target =
    document.getElementById("step" + number);

  if(target){

    target.classList.add("active");

  }

}


/* =========================================================
   CONFIRM BOOKING
========================================================= */

async function confirmBooking(){

  if(bookingSubmitting){

    return;

  }


  const name =
    document.getElementById(
      "customerName"
    ).value.trim();


  const phone =
    document.getElementById(
      "customerPhone"
    ).value.trim();


  const email =
    document.getElementById(
      "customerEmail"
    ).value.trim();


  /* Validation */

  if(!booking.businessId){

    showToast(
      "Booking system is not ready yet."
    );

    return;

  }


  if(!booking.serviceId){

    showToast(
      "Please select a service."
    );

    goStep(1);

    return;

  }


  if(!booking.dateISO){

    showToast(
      "Please select a date."
    );

    goStep(2);

    return;

  }


  if(!booking.timeISO){

    showToast(
      "Please select a time."
    );

    goStep(2);

    return;

  }


  if(!name){

    showToast(
      "Please enter your name."
    );

    document
      .getElementById("customerName")
      .focus();

    return;

  }


  if(!phone){

    showToast(
      "Please enter your phone number."
    );

    document
      .getElementById("customerPhone")
      .focus();

    return;

  }


  if(phone.replace(/\D/g,"").length < 10){

    showToast(
      "Please enter a valid phone number."
    );

    document
      .getElementById("customerPhone")
      .focus();

    return;

  }


  if(email){

    const emailValid =
      /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);

    if(!emailValid){

      showToast(
        "Please enter a valid email."
      );

      document
        .getElementById("customerEmail")
        .focus();

      return;

    }

  }


  bookingSubmitting = true;


  const confirmButton =
    document.querySelector(
      "#step3 .btn.gold"
    );


  const originalButtonText =
    confirmButton
      ? confirmButton.textContent
      : "Confirm booking";


  if(confirmButton){

    confirmButton.disabled = true;

    confirmButton.style.opacity = ".65";

    confirmButton.textContent =
      "Saving booking...";

  }


  try{

    /* =====================================================
       1. CREATE CUSTOMER
    ===================================================== */

    const { data:customer,error:customerError } =
      await db
        .from("customers")
        .insert({

          business_id: booking.businessId,

          name: name,

          phone: phone,

          email: email || null

        })
        .select("id")
        .single();


    if(customerError){

      console.error(
        "Customer insert error:",
        customerError
      );

      throw customerError;

    }


    /* =====================================================
       2. CREATE BOOKING
    ===================================================== */

    const { data:newBooking,error:bookingError } =
      await db
        .from("bookings")
        .insert({

          business_id:
            booking.businessId,

          service_id:
            booking.serviceId,

          customer_id:
            customer.id,

          customer_name:
            name,

          customer_phone:
            phone,

          customer_email:
            email || null,

          booking_date:
            booking.dateISO,

          booking_time:
            booking.timeISO,

          service_name:
            booking.service,

          service_price:
            booking.priceNumber,

          duration_minutes:
            booking.duration,

          status:
            "pending"

        })
        .select("id")
        .single();


    if(bookingError){

      console.error(
        "Booking insert error:",
        bookingError
      );

      throw bookingError;

    }


    console.log(
      "Booking successfully created:",
      newBooking
    );


    /* =====================================================
       3. SHOW SUCCESS
    ===================================================== */

    document.getElementById(
      "summaryService"
    ).textContent =
      booking.service;


    document.getElementById(
      "summaryDate"
    ).textContent =
      booking.date;


    document.getElementById(
      "summaryTime"
    ).textContent =
      booking.time;


    document.getElementById(
      "summaryName"
    ).textContent =
      name;


    document.querySelectorAll(
      ".booking-step"
    ).forEach(step=>{

      step.classList.remove("active");

    });


    document.getElementById(
      "success"
    ).classList.add("active");


    showToast(
      "Appointment successfully booked."
    );


  }catch(error){

    console.error(
      "BOOKFLOW booking error:",
      error
    );


    let message =
      "Unable to create booking. Please try again.";


    if(error?.message){

      const lower =
        error.message.toLowerCase();


      if(
        lower.includes("permission") ||
        lower.includes("policy") ||
        lower.includes("rls")
      ){

        message =
          "Booking permissions need to be configured.";

      }

      else if(
        lower.includes("duplicate")
      ){

        message =
          "This appointment may already be booked.";

      }

    }


    showToast(message);


  }finally{

    bookingSubmitting = false;


    if(confirmButton){

      confirmButton.disabled = false;

      confirmButton.style.opacity = "1";

      confirmButton.textContent =
        originalButtonText;

    }

  }

}


/* =========================================================
   RESET
========================================================= */

function resetBooking(){

  document.querySelectorAll(
    ".booking-step"
  ).forEach(step=>{

    step.classList.remove("active");

  });


  document.getElementById(
    "step1"
  ).classList.add("active");


  document.getElementById(
    "customerName"
  ).value = "";


  document.getElementById(
    "customerPhone"
  ).value = "";


  document.getElementById(
    "customerEmail"
  ).value = "";


  booking.serviceId = null;

  booking.service =
    "Hair Styling";

  booking.price =
    "₹799";

  booking.priceNumber =
    799;

  booking.duration =
    60;


  /* Reset date */

  const firstDate =
    document.querySelector(
      ".date-btn"
    );

  if(firstDate){

    document.querySelectorAll(
      ".date-btn"
    ).forEach(btn=>{
      btn.classList.remove("selected");
    });

    firstDate.classList.add("selected");

    const today =
      new Date();

    booking.date =
      today.toLocaleDateString(
        "en-US",
        {
          weekday:"short",
          month:"short",
          day:"numeric"
        }
      );

    booking.dateISO =
      formatISODate(today);

  }


  /* Reset time */

  document.querySelectorAll(
    ".time-btn"
  ).forEach(btn=>{
    btn.classList.remove("selected");
  });


  const firstTime =
    document.querySelector(
      ".time-btn"
    );


  if(firstTime){

    firstTime.classList.add(
      "selected"
    );

    booking.time =
      firstTime.textContent.trim();

    booking.timeISO =
      convertTimeToPostgres(
        booking.time
      );

  }


  document.getElementById(
    "selectedServiceName"
  ).textContent =
    "Select a service";


  document.getElementById(
    "selectedServicePrice"
  ).textContent =
    "—";

}


/* =========================================================
   NAVBAR
========================================================= */

window.addEventListener("scroll",()=>{

menuBtn.addEventListener(

    menuBtn.textContent =

document

    link.addEventListener(

        navbar.classList.remove(
          "mobile-open"
        );

        menuBtn.textContent =
          "☰";

      }
    );

  });


/* =========================================================
   SCROLL REVEAL
========================================================= */

const revealObserver =
  new IntersectionObserver(
    entries=>{

      entries.forEach(entry=>{

        if(entry.isIntersecting){

          entry.target.classList.add(
            "visible"
          );

          revealObserver.unobserve(
            entry.target
          );

        }

      });

    },
    {
      threshold:.12
    }
  );


document
  .querySelectorAll(".reveal")
  .forEach(el=>{

    revealObserver.observe(el);

  });


/* =========================================================
   TOAST
========================================================= */

let toastTimer;


function showToast(message){

  const toast =
    document.getElementById(
      "toast"
    );


  toast.textContent =
    message;


  toast.classList.add(
    "show"
  );


  clearTimeout(
    toastTimer
  );


  toastTimer =
    setTimeout(
      ()=>{
        toast.classList.remove(
          "show"
        );
      },
      3200
    );

}

/* =========================================================
   UTILITY FUNCTIONS
========================================================= */

function formatPrice(value){

  const number =
    Number(value);


  if(
    !Number.isFinite(number)
  ){

    return "₹0";

  }


  return "₹" +
    number.toLocaleString(
      "en-IN"
    );

}


function parsePrice(value){

  if(
    typeof value !== "string"
  ){

    return Number(value) || 0;

  }


  return Number(
    value
      .replace(/[₹,\s]/g,"")
  ) || 0;

}


function formatISODate(date){

  const year =
    date.getFullYear();


  const month =
    String(
      date.getMonth()+1
    ).padStart(2,"0");


  const day =
    String(
      date.getDate()
    ).padStart(2,"0");


  return `${year}-${month}-${day}`;

}


function convertDisplayDateToISO(displayDate){

  const currentYear =
    new Date().getFullYear();


  const parsed =
    new Date(
      `${displayDate}, ${currentYear}`
    );


  if(
    Number.isNaN(
      parsed.getTime()
    )
  ){

    return "";

  }


  return formatISODate(
    parsed
  );

}


function convertTimeToPostgres(time){

  if(
    !time
  ){

    return "";

  }


  const match =
    time.match(
      /^(\d{1,2}):(\d{2})\s*(AM|PM)$/i
    );


  if(!match){

    return time;

  }


  let hour =
    Number(match[1]);


  const minute =
    match[2];


  const period =
    match[3].toUpperCase();


  if(
    period === "AM" &&
    hour === 12
  ){

    hour = 0;

  }


  if(
    period === "PM" &&
    hour !== 12
  ){

    hour += 12;

  }


  return (
    String(hour).padStart(2,"0") +
    ":" +
    minute +
    ":00"
  );

}


function escapeHTML(value){

  return String(value)
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}

</script>
